      body {
        margin: 30px;
        font-family: Arial;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 3fr;
        gap: 20px;
      }
      .header {
        grid-column: 1/3;
        background-color: purple;
        padding: 30px;
        text-align: center;
        color: white;
      }
      .sidebar {
        background-color: green;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }
      .main {
        background-color: blue;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }
      .footer {
        grid-column: 1/3;
        background-color: orange;
        padding: 25px;
        text-align: center;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="header">Header</div>
      <div class="sidebar">Sidebar</div>
      <div class="maincontent">Main</div>
      <div class="footer">Footer</div>
    </div>
