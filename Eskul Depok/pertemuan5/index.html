<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Grid Layout</title>

    <style>
      body {
        margin: 30px;
        font-family: Arial;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 3fr;
        gap: 20px;
      }

      .header {
        grid-column: 1 / 3;

        background-color: purple;
        color: white;

        padding: 30px;
        border-radius: 20px;

        text-align: center;
      }

      .sidebar {
        background-color: green;
        color: white;

        height: 300px;
        border-radius: 20px;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;
      }

      .maincontent {
        background-color: blue;
        color: white;

        border-radius: 20px;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;
      }

      .footer {
        grid-column: 1 / 3;

        background-color: orange;
        color: white;

        padding: 25px;
        border-radius: 20px;

        text-align: center;
      }

      .menu p {
        margin: 20px;
      }

      button {
        background-color: lightblue;
        color: white;

        padding: 10px 20px;

        border: none;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <!-- HEADER -->
      <div class="header">
        <h1>MY WEBSITE</h1>
        <p>Belajar • Berkarya • Bertumbuh</p>
      </div>

      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="menu">
          <h2>MENU</h2>

          <p>Home</p>
          <p>About</p>
          <p>Contact</p>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="maincontent">
        <div>
          <h1>WELCOME TO MY WEBSITE</h1>

          <p>Saya sedang belajar HTML dan CSS Grid.</p>

          <button>Learn More</button>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer">
        <h3>© 2026 Ekskul IT</h3>

        <p>Terus belajar, terus berkembang.</p>
      </div>
    </div>
  </body>
</html>
