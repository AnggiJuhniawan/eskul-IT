<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      .container {
        margin: 10px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
      }
      .satu {
        background-color: red;
        border-radius: 20%;
        width: 100px;
        height: 100px;
      }
      .dua {
        background-color: green;
        border-radius: 20%;
        width: 100px;
        height: 100px;
      }
      .tiga {
        background-color: purple;
        border-radius: 20%;
        width: 100px;
        height: 100px;
      }
      .empat {
        background-color: aqua;
        border-radius: 20%;
        width: 100px;
        height: 100px;
      }
      .lima {
        background-color: fuchsia;
        border-radius: 20%;
        width: 100px;
        height: 100px;
      }
      .enam {
        background-color: yellow;
        border-radius: 20%;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="satu">1</div>
      <div class="dua">2</div>
      <div class="tiga">3</div>
      <div class="empat">4</div>
      <div class="lima">5</div>
      <div class="enam">6</div>
    </div>
  </body>
</html>
